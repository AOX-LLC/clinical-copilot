# Synthea settings for the dataset. Seed, reference date and population are on the
# command line in generate.sh so every input that decides the data is in one place.
# Modules: none selected, so the jar's built-in set runs; the jar checksum pins it.

# FHIR R4 only.
exporter.fhir.export = true
exporter.fhir_stu3.export = false
exporter.fhir_dstu2.export = false
exporter.ccda.export = false
exporter.csv.export = false
exporter.text.export = false
exporter.cpcds.export = false
exporter.bfd.export = false
exporter.symptoms.export = false

# Shared bundles the patient bundles reference.
exporter.hospital.fhir.export = true
exporter.practitioner.fhir.export = true

# A limited history keeps the dataset small.
exporter.years_of_history = 5
