[project]
name = "clinical-copilot-api"
version = "0.1.0"
description = "API for Clinical Copilot: patient timeline, provenance and EHR adapters (synthetic data only)."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "cryptography==50.0.2",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "graphql-core==3.2.6",
    "hypothesis==6.168.3",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["N999"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "db: needs a Postgres reachable through TEST_DATABASE_ADMIN_URL",
    "live: needs the running stack, with its FHIR server at LIVE_FHIR_BASE_URL",
]
addopts = "-ra --strict-markers"
